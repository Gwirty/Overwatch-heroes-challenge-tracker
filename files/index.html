    <script>
        const heroCards = document.querySelectorAll('.hero-container');

        heroCards.forEach(card => {
            const heroId = card.id;
          
            const updateHeroUI = (level) => {
                const fullBar = card.querySelector('.full-bar');
                const textSpan = card.querySelector('.st');

                if (fullBar) fullBar.style.width = (level * 8) + "%";
                if (textSpan) textSpan.innerText = level;
                if (level === 10) {
                    fullBar.style.backgroundColor = "green";
                } else {
                    fullBar.style.backgroundColor = "orange";
                }
                localStorage.setItem(heroId, level);
            };
            const savedLevel = localStorage.getItem(heroId);
            if (savedLevel !== null) {
                card.dataset.level = savedLevel;
                updateHeroUI(parseInt(savedLevel));
            } else {
                card.dataset.level = 0;
            }

            

            card.addEventListener('click', function () {
                let level = parseInt(this.dataset.level);
                if (level < 10) {
                    level++;
                    this.dataset.level = level;
                    updateHeroUI(level);
                }
            });

            card.addEventListener('contextmenu', function (e) {
                e.preventDefault(); // Stops the right-click menu from appearing

                let level = parseInt(this.dataset.level);
                if (level > 0) {
                    level--;
                    this.dataset.level = level;
                    updateHeroUI(level);
                }
            });
        });
    </script>
